[pytest]
testpaths = tests
norecursedirs = venv .venv __pycache__
addopts =
    -ra
    --strict-markers
    --tb=short
    --cov=src
    --cov-branch
    --cov-report=term-missing
    --cov-report=html
    --html=report.html
    --self-contained-html
    --junitxml=junit.xml
markers =
    on_pi: tests that need real hardware (skipped off-Pi)
filterwarnings =
    ignore::DeprecationWarning
